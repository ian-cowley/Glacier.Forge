name: Build and Release Glacier.Forge

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: write
      packages: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure GitHub Packages NuGet Source
        shell: bash
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name "github-packages" \
            --username "${{ github.repository_owner }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text || true

      - name: Restore dependencies
        run: dotnet restore Glacier.Forge.slnx

      - name: Build Release
        run: dotnet build Glacier.Forge.slnx --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test tests/Glacier.Forge.Tests/Glacier.Forge.Tests.csproj --configuration Release --no-restore --no-build --verbosity normal

      - name: Publish Native AOT Executable (Linux)
        if: matrix.os == 'ubuntu-latest' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        run: |
          mkdir -p release-assets
          dotnet publish src/Glacier.Forge/Glacier.Forge.csproj -c Release -r linux-x64 --self-contained true -o publish/linux-x64
          tar -czvf release-assets/glacier-forge-linux-x64.tar.gz -C publish/linux-x64 .

      - name: Publish Native AOT Executable (Windows)
        if: matrix.os == 'windows-latest' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          dotnet publish src/Glacier.Forge/Glacier.Forge.csproj -c Release -r win-x64 --self-contained true -o publish/win-x64
          Compress-Archive -Path "publish/win-x64/*" -DestinationPath "release-assets/glacier-forge-win-x64.zip" -Force

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
